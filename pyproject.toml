[build-system]
requires = ["setuptools>=62.6", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
homepage = "https://www.tu-braunschweig.de/pci/agjacob/software"
source = "https://github.com/chjacob-tubs/LocVib"
documentation = "https://locvibvibtools.readthedocs.io/en/latest/"

[project]
name = "vibtools"
version = "1.4"
description = "LocVib/VibTools: Python tools for localizing normal modes"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11.4"
license = {text = "GPLv3"}
authors = [
    {name = "Christoph Jacob"},
    {name = "Tobias Bergmann"},
    {name = "Julia Brueggemann"},
    {name = "Maria Checkmeneva"},
    {name = "Wadtey S. Oung"},
    {name = "Michael Welzel"},
    {name = "Mario Wolter"},
    {name = "others"},
]

# Base runtime dependencies (no openbabel)
dependencies = [
    "numpy",
    "matplotlib",
]

# Choose one of these depending on how you want openbabel provided:

[project.optional-dependencies]
# Usage with openbabel
openbabel = [
    "openbabel>=3.2.1",
]

# Usage with openbabel-wheel
openbabel-wheel = [
    "openbabel-wheel",
]

# Testing with openbabel
testing-openbabel = [
    "vibtools[openbabel]",
    "pytest",
    "pytest-cov",
    "pylint",
    "docstr-coverage",
]

# Testing with openbabel-wheel
testing-openbabel-wheel = [
    "vibtools[openbabel-wheel]",
    "pytest",
    "pytest-cov",
    "pylint",
    "docstr-coverage",
]

# Documentation building dependencies with openbabel
docs-openbabel = [
    "vibtools[openbabel]",
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-design",
    "sphinx-mdinclude",
]

# Documentation building dependencies with openbabel-wheel
docs-openbabel-wheel = [
    "vibtools[openbabel-wheel]",
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-design",
    "sphinx-mdinclude",
]

# Full install with openbabel
full-openbabel = [
    "vibtools[testing-openbabel]",
    "vibtools[docs-openbabel]",
]

# Full install with openbabel-wheel
full-openbabel-wheel = [
    "vibtools[testing-openbabel-wheel]",
    "vibtools[docs-openbabel-wheel]",
]
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"VibTools" = [
    "tests/test_data/**/*",
    "example/**/*"
]

