[build-system]
requires = ["setuptools>=62.6", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibtools"
version = "1.4"
description = "LocVib/VibTools: Python tools for localizing normal modes"
authors = [
  { name="Christoph Jacob, Julia Brueggemann, Mario Wolter, Michael Welzel and others" }
]
readme = "README.md"
#license = { file="LICENSE" }   # Or "MIT" etc.
requires-python = ">=3.8"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
# Load main dependencies from requirements/requirements.txt
dependencies = { file = ["requirements/requirements.txt"] }

[project.optional-dependencies]
# Choose one of these depending on how you want openbabel provided:
openbabel = [
    "openbabel",
]
openbabel-wheel = [
    "openbabel-wheel",
]

# Optional convenience extra that picks a default for most users:
default = [
    "vibtools[openbabel-wheel]",
]

[project.urls]
"Homepage" = "https://github.com/chjacob-tubs/LocVib"


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"VibTools" = [
    "tests/test_data/**/*",
    "example/**/*"
]

